################################################################################
# External Secrets Operator — ClusterSecretStore + ExternalSecrets
# Syncs AWS Secrets Manager → Kubernetes Secrets
################################################################################

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# SSM Parameter Store store
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# Database credentials ExternalSecret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: database-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:5432/{{ .dbname }}?sslmode=require"
        DB_HOST: "{{ .host }}"
        DB_PORT: "5432"
        DB_NAME: "{{ .dbname }}"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: myapp-prod/database/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: myapp-prod/database/credentials
        property: password
    - secretKey: host
      remoteRef:
        key: myapp-prod/database/credentials
        property: host
    - secretKey: dbname
      remoteRef:
        key: myapp-prod/database/credentials
        property: dbname

---
# Redis credentials ExternalSecret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_URL: "rediss://{{ .auth_token }}@{{ .host }}:6380"
        REDIS_AUTH_TOKEN: "{{ .auth_token }}"
        REDIS_HOST: "{{ .host }}"

  data:
    - secretKey: auth_token
      remoteRef:
        key: myapp-prod/redis/auth
        property: auth_token
    - secretKey: host
      remoteRef:
        key: myapp-prod/redis/auth
        property: host

---
# Application secrets ExternalSecret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: app
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: app-secrets
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: myapp-prod/app/secrets
        decodingStrategy: None

---
# Service Account for External Secrets IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/myapp-prod-external-secrets-irsa
