################################################################################
# cert-manager — ClusterIssuers for internal TLS (mTLS via Istio)
# Uses AWS Private CA for internal certificates
################################################################################

# Production ClusterIssuer — AWS Private CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aws-pca-issuer
spec:
  acmpca:
    arn: arn:aws:acm-pca:us-east-1:ACCOUNT_ID:certificate-authority/CA_ID
    region: us-east-1
    signingAlgorithm: SHA256WITHRSA
    template:
      arn: arn:aws:acm-pca:::template/EndEntityCertificate/V1

---
# Self-signed issuer for bootstrapping
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---
# Internal CA Certificate (for development/staging)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: myapp-internal-ca
  secretName: internal-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# Internal CA Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-issuer
spec:
  ca:
    secretName: internal-ca-secret

---
# App backend certificate (mTLS)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-backend-cert
  namespace: app
spec:
  secretName: app-backend-tls
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days before expiry
  isCA: false
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256
  usages:
    - server auth
    - client auth
  dnsNames:
    - app-backend.app.svc.cluster.local
    - app-backend
  issuerRef:
    name: aws-pca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
